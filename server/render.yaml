services:
  - type: web
    name: seafood-forecasting-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      python --version
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
      mkdir -p data/processed models/saved_models results
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5174
    healthCheckPath: /health
