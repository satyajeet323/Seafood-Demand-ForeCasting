services:
  - type: web
    name: seafood-forecasting-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5174
